
name: Diagnose iOS Project

on:
  push:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -la
          test -f CarPlayMirrorBridge_CloudBuild.zip

      - name: Unzip project
        run: |
          mkdir -p source
          unzip -o CarPlayMirrorBridge_CloudBuild.zip -d source
          echo "===== Extracted files ====="
          find source -maxdepth 4 -type f | sort | head -300

      - name: Find Xcode project configuration
        run: |
          echo "===== project.yml ====="
          find source -name project.yml -print
          echo "===== Info.plist ====="
          find source -name Info.plist -print
          echo "===== Entitlements ====="
          find source -name '*.entitlements' -print
          echo "===== Xcode projects ====="
          find source \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and build
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_YML="$(find source -name project.yml -print -quit)"
          if [ -z "$PROJECT_YML" ]; then
            echo "ERROR: project.yml not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_YML")"
          cd "$PROJECT_DIR"

          xcodegen generate
          xcodebuild -list -project CarPlayMirrorBridge.xcodeproj
